<style>
  @font-face {
    font-family: 'DigiSarvenaz';
    src: url('assets/Font/Digi Sarvenaz_0.ttf') format('truetype');
    font-display: swap;
  }
  
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'DigiSarvenaz', Arial, sans-serif; }
  #game-wrapper {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: #000; max-width: 450px; max-height: 100vh;
  }
  #game-container {
    box-shadow: 0 12px 30px rgba(0,0,0,0.35); border-radius: 8px; overflow: hidden;
    position: relative; background: #000;

  @media (min-width: 769px) {
    #game-wrapper { max-width: 450px; width: 450px; height: 100vh; }
    #game-container { width: 450px !important; height: 100vh !important; }
  }
  
  /* Welcome Screen */
  #welcome-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1001; color: #fff;

  .welcome-logo { width: 120px; height: 120px; margin-bottom: 30px;
    background: url('assets/images/ui/logo 002_vz.png') center/contain no-repeat;

  }
  input[type="text"], textarea { -webkit-user-select: text; -moz-user-select: text; user-select: text; }
  .phone-input-container { margin-bottom: 30px; }

    text-align: center; direction: ltr; width: 200px;

  .start-btn { padding: 15px 30px; background: #fff; color: #000; border: none; border-radius: 8px;

  .leaderboard-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;

}

.leaderboard-header .header-rank {

}

.leaderboard-header .header-name {
  flex: 1;
  text-align: center;
}

.leaderboard-header .header-score {

}
.user-rank-fixed {
  position: absolute;
  bottom: 15px;
  left: 15px;

}

.user-rank-number {

}

  <script>
    
let playerPhone = localStorage.getItem('playerPhone');
let playerName = localStorage.getItem('playerName');
let gameCount = parseInt(localStorage.getItem('gamePlayCount')) || 0;
let hasPlayedGame = gameCount >= 3;

    // تابع برای درخواست API
    async function fetchAPI(url, options) {
      try {
        const response = await fetch(url, options);
        if (!response.ok) throw new Error('خطا در ارتباط با سرور');
        return await response.json();
      } catch (error) {
        console.error('API Error:', error);
        throw error;
      }
    }

    // چک کردن شماره تلفن در صفحه خوش‌آمدگویی
    document.getElementById('start-game-btn').addEventListener('click', async () => {
      const phoneInput = document.getElementById('phone-input');
      const phone = phoneInput.value.trim();

      if (!playerPhone && (!phone || phone.length < 10)) {
        alert('لطفاً شماره موبایل معتبر وارد کنید');
        return;
      }
      

      if (!playerPhone && phone) {
        try {
          const result = await fetchAPI('https://game.mypechpech.com/app/wp-json/user-points/v1/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mobile: phone })
          });
          if (result.exists) {
            document.getElementById('start-game-btn').style.display = 'none';
            const welcomeTitle = document.querySelector('.welcome-title');
            welcomeTitle.textContent = 'شما قبلاً این بازی را انجام داده‌اید';
            welcomeTitle.style.color = '#f1c40f';
            document.getElementById('phone-container').style.display = 'none';
            return;
          }
          localStorage.setItem('playerPhone', phone);
          playerPhone = phone;
        } catch (error) {
          alert('خطا در ارتباط با سرور، لطفاً دوباره تلاش کنید');
          return;
        }
      }

      document.getElementById('welcome-screen').style.display = 'none';
      initializeGame();
    });

    // اگر شماره تلفن وجود داره، ورودی مخفی بشه
    if (playerPhone) document.getElementById('phone-container').style.display = 'none';
    if (hasPlayedGame) {
      document.getElementById('start-game-btn').style.display = 'none';
      const welcomeTitle = document.querySelector('.welcome-title');
      welcomeTitle.textContent = 'شما قبلاً این بازی را انجام داده‌اید';
      welcomeTitle.style.color = '#f1c40f';
    }

    // --- Loading System ---
    class LoadingManager {
      constructor() { this.progress = 0; this.loadingSteps = [
        { name: 'بارگذاری ...', duration: 500 },
        { name: 'بارگذاری تصاویر ماشین‌ها...', duration: 800 },
        { name: 'بارگذاری پاورآپ‌ها...', duration: 600 },
        { name: 'بارگذاری رابط کاربری...', duration: 400 },
        { name: 'آماده‌سازی جاده...', duration: 300 },
        { name: 'تنظیم بازی...', duration: 400 }
      ]; this.currentStep = 0; }
      async start(isFirstLoad) {
        if (!isFirstLoad) { document.getElementById('loading-screen').style.display = 'none'; document.getElementById('game-wrapper').style.display = 'flex'; return; }
        document.getElementById('loading-screen').style.display = 'flex';
        const progressBar = document.getElementById('loading-progress');
        const loadingText = document.querySelector('.loading-text');
        for (let i = 0; i < this.loadingSteps.length; i++) {
          const step = this.loadingSteps[i];
          loadingText.textContent = step.name;
          await this.simulateLoading(step.duration, (progress) => {
            const totalProgress = ((i + progress) / this.loadingSteps.length) * 100;
            progressBar.style.width = totalProgress + '%';
          });
        }
        loadingText.textContent = '✅ بازی آماده است!';
        await new Promise(resolve => setTimeout(resolve, 500));
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('game-wrapper').style.display = 'flex';
        localStorage.setItem('gameLoaded', 'true');
      }
      simulateLoading(duration, onProgress) {
        return new Promise(resolve => {
          let elapsed = 0;
          const interval = setInterval(() => {
            elapsed += 50; const progress = Math.min(elapsed / duration, 1);
            onProgress(progress); if (progress >= 1) { clearInterval(interval); resolve(); }
          }, 50);
        });
      }
    }

    // --- Leaderboard and API System ---
    const LB_KEY = 'laneCarLeaderboard_v3';
    let leaderboard = [];
    let currentPlayerScore = 0;
    let currentPlayerName = null;

    async function checkUserRegistration(phone) {
      try {
        const result = await fetchAPI('https://game.mypechpech.com/app/wp-json/user-points/v1/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mobile: phone })
        });
        return result.registered || false;
      } catch (error) {
        alert('خطا در ارتباط با سرور، لطفاً دوباره تلاش کنید');
        return true; // فرض می‌کنیم ثبت‌نام شده تا از بارگذاری جلوگیری بشه
      }
    }

    async function saveScoreToServer(name, phone, score) {
      try {
        const result = await fetchAPI('https://game.mypechpech.com/app/wp-json/user-points/v1/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, mobile: phone, points: score })
        });
        return result.success || false;
      } catch (error) {
        alert('خطا در ارتباط با سرور، لطفاً دوباره تلاش کنید');
        return false;
      }
    }

   async function getTop10WithUser(phone) {
  try {
    const result = await fetchAPI('https://game.mypechpech.com/app/wp-json/user-points/v1/top10-with-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mobile: phone })
    });
    // فرض می‌کنیم ساختار داده شامل top10 و userRank باشه
    return {
      top10: result.top10 || [],
      userRank: result.userRank || getPlayerRank(currentPlayerScore) // اگر userRank برگردونده نشد، محاسبه локально
    };
  } catch (error) {
    alert('خطا در ارتباط با سرور، لطفاً دوباره تلاش کنید');
    return { top10: [], userRank: null };
  }
}
    function applyUpdatedCSS() {
  // حذف CSS قدیمی اگر وجود داشت
  const oldStyle = document.getElementById('additional-leaderboard-styles');
  if (oldStyle) {
    oldStyle.remove();
  }
  
  // اضافه کردن CSS جدید
  const styleElement = document.createElement('style');
  styleElement.id = 'updated-leaderboard-styles';
 // styleElement.textContent = updatedCSS;
  document.head.appendChild(styleElement);
}

    function loadLeaderboard() {
      try {
        const raw = localStorage.getItem(LB_KEY);
        leaderboard = raw ? JSON.parse(raw) : [];
      } catch (e) { leaderboard = []; }
    }

async function updateGameOverLeaderboard(phone) {
  const list = document.getElementById('game-over-leaderboard-list');
  list.innerHTML = '';
  
  try {
    const result = await getTop10WithUser(phone);
    const { top10, user_rank, user } = result || { top10: [], user_rank: null, user: null };
    
    // مرتب‌سازی top10 بر اساس امتیاز (نزولی) و در صورت برابری بر اساس تاریخ (صعودی)
    const sortedTop10 = top10.sort((a, b) => {
      const pointsA = parseInt(a.points) || 0;
      const pointsB = parseInt(b.points) || 0;
      
      if (pointsA !== pointsB) {
        return pointsB - pointsA; // امتیاز بیشتر اول
      }
      
      // در صورت برابری امتیاز، تاریخ قدیمی‌تر اول
      return new Date(a.created_at) - new Date(b.created_at);
    });

    leaderboard = sortedTop10;
// اضافه کردن هدر
const headerDiv = document.createElement('div');
headerDiv.className = 'leaderboard-header';
headerDiv.innerHTML = `
  <span class="header-rank">رتبه</span>
  <span class="header-name">نام</span>
  <span class="header-score">امتیاز</span>
`;
list.appendChild(headerDiv);
    // نمایش فقط 10 نفر برتر (بدون رتبه کاربر)
    sortedTop10.forEach((entry, i) => {
      const row = document.createElement('div');
      row.className = 'entry';
      const rank = i + 1;
      const rankEmoji = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `${rank}.`;
      const firstName = entry.name ? entry.name.split(' ')[0] : 'ناشناس';
      
      row.innerHTML = `<span class="player-rank">${rankEmoji}</span><span class="player-name">${escapeHtml(firstName)}</span><span class="entry-score">${entry.points || 0}</span>`;
      
      // اگر این کاربر همان کاربر جاری است
      if (entry.mobile === phone && rank <= 10) {
        row.classList.add('current-player');
      }
      
      list.appendChild(row);
    });

    // به‌روزرسانی رتبه کاربر در المان جداگانه
    updateUserRankDisplay(user_rank, user, phone);
    
  } catch (error) {
    console.error('خطا در بارگذاری لیدربورد:', error);
    
    // نمایش پیام خطا
    const errorDiv = document.createElement('div');
    errorDiv.style.textAlign = 'center';
    errorDiv.style.color = '#ff6b6b';
    errorDiv.textContent = 'خطا در بارگذاری لیدربورد';
    list.appendChild(errorDiv);
  }
}

// تابع جدید برای به‌روزرسانی نمایش رتبه کاربر
function updateUserRankDisplay(user_rank, user, phone) {
  let userRankContainer = document.getElementById('user-rank-container');
  
  // اگر کانتینر وجود نداشت، ایجاد کن
  if (!userRankContainer) {
    userRankContainer = document.createElement('div');
    userRankContainer.id = 'user-rank-container';
    userRankContainer.className = 'user-rank-fixed';
    
    // اضافه کردن به انتهای game-over div
    const gameOverDiv = document.getElementById('game-over');
    gameOverDiv.appendChild(userRankContainer);
  }
  
  // پاک کردن محتوای قبلی
  userRankContainer.innerHTML = '';
  
  let userRank, userName, userScore;
  
  // استفاده از داده‌های user از API
  if (user) {
    userRank = user_rank || 1;
    userName = user.name ? user.name.split(' ')[0] : 'شما';
    userScore = user.points || currentPlayerScore || 0;
  } else {
    // حالت fallback
    userRank = user_rank || getPlayerRank(currentPlayerScore);
    userName = currentPlayerName ? currentPlayerName.split(' ')[0] : 'شما';
    userScore = currentPlayerScore || 0;
  }
  
  const rankEmoji = userRank === 1 ? '🥇' : userRank === 2 ? '🥈' : userRank === 3 ? '🥉' : `${userRank}.`;
  
  // ایجاد المان نمایش رتبه
  const userRankRow = document.createElement('div');
  userRankRow.className = 'user-rank-entry';
  userRankRow.innerHTML = `
    <span class="user-rank-number">${rankEmoji}</span>
    <span class="user-rank-name">${escapeHtml(userName)}</span>
    <span class="user-rank-score">${userScore}</span>
  `;
  
  userRankContainer.appendChild(userRankRow);
}

// تصحیح تابع getTop10WithUser
async function getTop10WithUser(phone) {
  try {
    const result = await fetchAPI('https://game.mypechpech.com/app/wp-json/user-points/v1/top10-with-user', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mobile: phone })
    });
    
    return {
      top10: result.top10 || [],
      user_rank: result.user_rank || null,
      user: result.user || null,
      user_in_top10: result.user_in_top10 || false
    };
  } catch (error) {
    console.error('خطا در دریافت لیدربورد:', error);
    return { 
      top10: [], 
      user_rank: 1,
      user: null,
      user_in_top10: false
    };
  }
}

// تصحیح تابع getPlayerRank برای مطابقت با API
function getPlayerRank(score) {
  if (!leaderboard || leaderboard.length === 0) {
    return 1;
  }
  
  // محاسبه رتبه بر اساس امتیاز و تاریخ
  let rank = 1;
  for (let entry of leaderboard) {
    const entryPoints = parseInt(entry.points) || 0;
    if (entryPoints > score) {
      rank++;
    } else if (entryPoints === score) {
      // در صورت برابری امتیاز، بر اساس تاریخ
      const entryDate = new Date(entry.created_at);
      const currentDate = new Date(); // فرض می‌کنیم امتیاز جاری الان ثبت شده
      if (entryDate < currentDate) {
        rank++;
      }
    }
  }
  
  return rank;
}

function showGameOver(score) {
  finalScoreEl.textContent = `امتیاز نهایی: ${score.toLocaleString()}`;
  
  let rankText = '';
  const estimatedRank = getPlayerRank(score);
  
  if (estimatedRank === 1 && (!leaderboard.length || score > Math.max(...leaderboard.map(e => parseInt(e.points) || 0)))) {
    rankText = '🥇 احتمال رکورد جدید!';
  } else if (estimatedRank <= 3) {
    rankText = `🏆 رتبه تخمینی: ${estimatedRank}`;
  } else if (estimatedRank <= 10) {
    rankText = `👍 رتبه تخمینی: ${estimatedRank}`;
  } else {
    rankText = `رتبه تخمینی: ${estimatedRank}`;
  }
  
  playerRankEl.textContent = rankText;
  gameOverModal.style.display = 'block';
  
  const gameCount = parseInt(localStorage.getItem('gamePlayCount')) || 0;
  const isThirdGame = gameCount >= 2; // سومین بازی
  
  if (gameCount === 0) {
    // بار اول: نام بگیر
    nameInputContainer.style.display = 'block';
    saveBtn.textContent = '💾 ذخیره امتیاز';
  } else {
    // بار دوم یا سوم: نام نگیر
    nameInputContainer.style.display = 'none';
    if (isThirdGame) {
      // سومین بار: امتیاز رو خودکار ارسال کن
      saveBtn.textContent = '⏳ در حال ذخیره...';
      saveBtn.disabled = true;
      autoSaveScore(score);
    } else {
      // بار دوم: دکمه تلاش دوباره
      saveBtn.textContent = '🔄 تلاش دوباره';
    }
  }
  
  document.getElementById('game-over-leaderboard').style.display = 'none';
}

// تابع جدید برای ذخیره خودکار در بازی سوم
async function autoSaveScore(score) {
  try {
    const success = await saveScoreToServer(playerName, playerPhone, score);
    if (success) {
      let newGameCount = parseInt(localStorage.getItem('gamePlayCount')) + 1;
      localStorage.setItem('gamePlayCount', newGameCount.toString());
      localStorage.setItem('hasPlayedGame', 'true');
      
      saveBtn.textContent = '✅ ذخیره شد!';
      saveBtn.style.display = 'none';
      document.getElementById('game-over-leaderboard').style.display = 'block';
      await updateGameOverLeaderboard(playerPhone);
    } else {
      saveBtn.textContent = '❌ ارسال ناموفق بود';
      saveBtn.disabled = false;
    }
  } catch (error) {
    saveBtn.textContent = '❌ ارسال ناموفق بود';
    saveBtn.disabled = false;
  }
}

          if (this.obstacleTimer) this.obstacleTimer.reset({ delay: this.obstacleSpawnDelay, loop: true, callback: this.spawnObstacle, callbackScope: this });
          if (this.powerUpTimer) this.powerUpTimer.reset({ delay: newPowerUpDelay, loop: true, callback: () => {
            const spawnChance = Math.min(0.98, 0.95 + (this.difficultyLevel * 0.01));
            if (Math.random() < spawnChance) this.spawnPowerUp();
          }, callbackScope: this });
          if (this.extraPowerUpTimer) this.extraPowerUpTimer.reset({ delay: newExtraPowerUpDelay, loop: true, callback: () => {
            if (Math.random() < 0.7) this.spawnPowerUp();
          }, callbackScope: this });
          const newBonusDelay = Math.max(800, 1800 - (this.difficultyLevel * 100));
          if (this.bonusTextTimer) this.bonusTextTimer.reset({ delay: newBonusDelay, loop: true, callback: () => {
            const bonusChance = Math.min(0.9, 0.75 + (this.difficultyLevel * 0.03));
            if (Math.random() < bonusChance) this.spawnBonusText();
          }, callbackScope: this });
        }
      }
      gameOver() {
        [this.obstacleTimer, this.powerUpTimer, this.speedTimer, this.bonusTextTimer].forEach(timer => { if (timer) timer.remove(false); });
        this.physics.pause(); this.music.stop(); this.isGameOver = true;
        if (this.wasd) Object.values(this.wasd).forEach(key => { if (key) key.enabled = false; });
        if (this.cursors) Object.values(this.cursors).forEach(key => { if (key) key.enabled = false; });
        currentPlayerScore = this.score; showGameOver(this.score);
      }
      _updateUI() {
        document.getElementById('ui-score').textContent = `امتیاز: ${this.score.toLocaleString()}${this.powerUpActive ? ' (دوبرابر!)' : ''}`;
        document.getElementById('ui-speed').textContent = `سرعت: ${this.speed.toFixed(1)}`;
        document.getElementById('lives-count').textContent = this.lives; this.updateHeartsDisplay();
      }
      updateHeartsDisplay() {
        const heartsContainer = document.getElementById('hearts-container');
        heartsContainer.innerHTML = '';
        for (let i = 0; i < this.maxLives; i++) {
          const heart = document.createElement('div'); heart.className = 'heart';
          if (i >= this.lives) heart.classList.add('empty'); heartsContainer.appendChild(heart);
        }
      }
      createFallbackTextures() {
        const carG = this.add.graphics(); carG.fillStyle(0xe74c3c, 1); carG.fillRoundedRect(0, 0, 60, 96, 8);
        carG.fillStyle(0xffffff, 1); carG.fillRoundedRect(8, 15, 44, 25, 4); carG.fillRoundedRect(8, 50, 44, 20, 4);
        carG.fillStyle(0x2c3e50, 1); carG.fillCircle(15, 10, 6); carG.fillCircle(45, 10, 6); carG.fillCircle(15, 86, 6); carG.fillCircle(45, 86, 6);
        carG.generateTexture('player-car-fallback', 60, 96); carG.destroy();
        const obsG = this.add.graphics(); obsG.fillStyle(0x34495e, 1); obsG.fillRoundedRect(0, 0, 55 * 1.3, 94 * 1.3, 6);
        obsG.fillStyle(0xffffff, 1); obsG.fillRoundedRect(6 * 1.3, 12 * 1.3, 43 * 1.3, 22 * 1.3, 3); obsG.fillRoundedRect(6 * 1.3, 45 * 1.3, 43 * 1.3, 18 * 1.3, 3);
        obsG.fillStyle(0x2c3e50, 1); obsG.fillCircle(13 * 1.3, 8 * 1.3, 5 * 1.3); obsG.fillCircle(42 * 1.3, 8 * 1.3, 5 * 1.3);
        obsG.fillCircle(13 * 1.3, 86 * 1.3, 5 * 1.3); obsG.fillCircle(42 * 1.3, 86 * 1.3, 5 * 1.3); obsG.generateTexture('obstacle-fallback', 55 * 1.3, 94 * 1.3); obsG.destroy();
        const powerG = this.add.graphics(); powerG.fillStyle(0xf1c40f, 1); powerG.fillStar(20, 20, 5, 15, 10, 0);
        powerG.fillStyle(0xffffff, 0.6); powerG.fillStar(20, 20, 5, 8, 6, 0); powerG.generateTexture('powerup-fallback', 40, 40); powerG.destroy();
      }
    }

    let game;

    async function initializeGame() {
      const isFirstLoad = !localStorage.getItem('gameLoaded');
      const loadingManager = new LoadingManager();
      await loadingManager.start(isFirstLoad);
      const size = getGameSize();
      const config = {
        type: Phaser.AUTO, parent: 'game-container', width: size.width, height: size.height,
        backgroundColor: '#000000', physics: { default: 'arcade', arcade: { debug: false, gravity: { y: 0 } } },
        scene: MainScene, scale: { mode: Phaser.Scale.RESIZE, autoCenter: Phaser.Scale.CENTER_BOTH, width: size.width, height: size.height }
      };
      
      game = new Phaser.Game(config); setupResizeHandler();
    }

    function setupResizeHandler() {
      window.addEventListener('resize', () => {
        const size = getGameSize(); const gameContainer = document.getElementById('game-container');
        const gameWrapper = document.getElementById('game-wrapper');
        gameContainer.style.width = size.width + 'px'; gameContainer.style.height = size.height + 'px';
        if (window.innerWidth > 768) { gameWrapper.style.width = size.width + 'px'; gameWrapper.style.height = size.height + 'px';
          gameWrapper.style.top = '50%'; gameWrapper.style.left = '50%'; gameWrapper.style.transform = 'translate(-50%, -50%)';
        } else { gameWrapper.style.width = size.width + 'px'; gameWrapper.style.height = size.height + 'px';
          gameWrapper.style.top = '0'; gameWrapper.style.left = '0'; gameWrapper.style.transform = 'none';
        }
        if (game && game.scale) { game.scale.resize(size.width, size.height);
          const scene = game.scene.getScene('MainScene');
          if (scene && scene.roadTexture) { scene.roadTexture.setDisplaySize(size.width, size.height);
            scene.roadTexture.setTileScale(size.width / scene.textures.get('road-texture').getSourceImage().width,
              size.height / scene.textures.get('road-texture').getSourceImage().height);
          }
        }
      }); window.dispatchEvent(new Event('resize'));
    }

    const gameOverModal = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const playerRankEl = document.getElementById('player-rank-display');
    const nameInputContainer = document.getElementById('name-input-container');
    const firstNameInput = document.getElementById('first-name');
    const lastNameInput = document.getElementById('last-name');
    const saveBtn = document.getElementById('save-btn');

saveBtn.addEventListener('click', async () => {

  if (gameCount === 0) {

    localStorage.setItem('playerName', fullName);
    playerName = fullName;
  }

  // بار دوم: دکمه تلاش دوباره

  // حذف event listener قبلی
  saveBtn.removeEventListener('click', saveBtn.clickHandler);

    setTimeout(async () => {

    }, 100);

  saveBtn.addEventListener('click', saveBtn.clickHandler);
}
        nameInputContainer.style.display = 'none';

      saveBtn.disabled = false; 
    }, 2000);

});
